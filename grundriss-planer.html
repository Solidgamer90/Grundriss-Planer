<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Grundriss-Planer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: Werkzeugleiste oben, Zeichenblatt füllt den Rest, schmale Eigenschaftsleiste rechts (mobil darunter) */
:root{
  --paper:#e9eeec; --sheet:#f7f9f8; --panel:#fdfefe; --ink:#1c2a2e; --muted:#5b6b6e; --line:#d0d8d5;
  --grid:#e0e6e3; --grid-major:#c5cfcb; --wall:#2a393e; --accent:#1f5fd1; --accent-soft:#e3ecfb;
  --dim:#c2185b; --gap:#0b8763; --danger:#b42335;
  --font-ui:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12181a; --sheet:#182124; --panel:#1c2629; --ink:#e2eae7; --muted:#93a3a2; --line:#2c393c;
  --grid:#1f292c; --grid-major:#2d3a3e; --wall:#cbd6d3; --accent:#7aa5ff; --accent-soft:#1f2d48;
  --dim:#ff79aa; --gap:#45d3a3; --danger:#ff7a86; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#12181a; --sheet:#182124; --panel:#1c2629; --ink:#e2eae7; --muted:#93a3a2; --line:#2c393c;
  --grid:#1f292c; --grid-major:#2d3a3e; --wall:#cbd6d3; --accent:#7aa5ff; --accent-soft:#1f2d48;
  --dim:#ff79aa; --gap:#45d3a3; --danger:#ff7a86; color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 var(--font-ui)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-weight:600;font-size:15px;letter-spacing:.01em;white-space:nowrap}
#plan-name{border:1px solid transparent;background:transparent;border-radius:4px;padding:2px 6px;width:13em;max-width:40vw;color:var(--muted)}
#plan-name:hover,#plan-name:focus{border-color:var(--line);color:var(--ink)}
.tools{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tool{display:flex;align-items:center;gap:6px;padding:6px 10px;background:transparent;border:0;border-right:1px solid var(--line);cursor:pointer}
.tool:last-child{border-right:0}
.tool svg{width:18px;height:18px;flex:none}
.tool kbd{font:500 11px var(--font-mono);color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.tool[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tool[aria-pressed="true"] kbd{color:var(--accent);border-color:currentColor}
.tool:hover{background:var(--accent-soft)}
.spacer{flex:1}
.seg{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg-l{padding:0 8px;font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg button{padding:6px 10px;border:0;border-left:1px solid var(--line);background:transparent;cursor:pointer}
.seg button:hover{background:var(--accent-soft)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.act{padding:6px 10px;border:1px solid var(--line);background:var(--panel);border-radius:6px;cursor:pointer}
.act:hover{border-color:var(--muted)}
.act:disabled{opacity:.4;cursor:default}
.act.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.act.danger{color:var(--danger)}

.main{display:grid;grid-template-columns:minmax(0,1fr) 290px;min-height:0}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--sheet)}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:default}
.calib{position:absolute;top:12px;left:max(12px,env(safe-area-inset-left,0px));max-width:min(420px,calc(100% - 120px));
  background:var(--panel);border:1px solid var(--dim);border-left-width:4px;border-radius:6px;padding:8px 12px;font-size:13px}
.calib b{color:var(--dim)}
.zoom{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.zoom button{width:34px;height:32px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;font:500 15px var(--font-mono)}
.zoom button:last-child{border-bottom:0;font-size:11px}
.zoom button:hover{background:var(--accent-soft)}
.hint{position:absolute;bottom:12px;left:max(12px,env(safe-area-inset-left,0px));max-width:calc(100% - 200px);
  background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12.5px;color:var(--muted)}
.hint b{color:var(--ink);font-weight:500}

aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:20px}
.eyebrow{margin:0;font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
aside h2{margin:2px 0 0;font-size:19px;font-weight:600;text-wrap:balance;overflow-wrap:anywhere}
dl.props{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0}
dl.props dt{color:var(--muted)}
dl.props dd{margin:0;font:400 13px var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}
.chip{display:inline-block;font:500 11px var(--font-mono);padding:1px 6px;border-radius:10px;border:1px solid currentColor}
.chip.fix{color:var(--accent)} .chip.free{color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.note{margin:10px 0 0;font-size:12.5px;color:var(--muted)}
.list{display:flex;flex-direction:column;margin-top:8px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px;padding:6px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.row:hover{background:var(--accent-soft)}
.row .sw{width:10px;height:10px;border-radius:2px;flex:none}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sz{font:400 12px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.settings{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px;margin-top:auto}
.settings label{display:flex;align-items:center;gap:8px}
.settings .num{display:flex;justify-content:space-between;align-items:center}
.settings input[type=text]{width:6.5em;text-align:right;font-family:var(--font-mono);padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--sheet)}

.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 35%,transparent);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{width:min(430px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.dlg header{padding:14px 18px 0}
.dlg h3{margin:0;font-size:18px;font-weight:600}
.dlg .body{padding:12px 18px;display:flex;flex-direction:column;gap:12px}
.dlg footer{display:flex;justify-content:flex-end;gap:8px;padding:0 18px 16px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld span{font-size:12.5px;color:var(--muted)}
.fld input,.fld select,.fld textarea{padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:var(--sheet)}
.fld input.mono,.fld textarea{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{padding:3px 8px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);cursor:pointer;font-size:12.5px}
.presets button:hover{border-color:var(--accent);color:var(--accent)}
.swatches{display:flex;gap:8px}
.swatches label{position:relative;cursor:pointer}
.swatches input{position:absolute;opacity:0}
.swatches i{display:block;width:24px;height:24px;border-radius:4px;border:2px solid transparent}
.swatches input:checked + i{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--panel)}
.swatches input:focus-visible + i{outline:2px solid var(--accent);outline-offset:2px}
.radios{display:flex;flex-wrap:wrap;gap:12px}
.radios label,.check{display:flex;gap:6px;align-items:center}
.info{margin:0;font-size:13px;padding:8px 10px;border-radius:5px;background:var(--accent-soft)}
.err{margin:0;color:var(--danger);font-size:13px}
textarea{min-height:160px;resize:vertical;font-size:12px}

@media (max-width:760px){
  .main{grid-template-columns:1fr;grid-template-rows:minmax(300px,1fr) auto}
  aside{border-left:0;border-top:1px solid var(--line);max-height:42vh;
    padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tool span.lbl{display:none}
  .hint{display:none}
  #plan-name{width:9em}
}
#print{display:none}
@media print{
  .app,.overlay{display:none!important}
  html,body{height:auto;background:#fff!important;color:#111}
  #print{display:block;font-family:var(--font-ui);color:#111}
  #print .ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:.3mm solid #111;padding-bottom:1.5mm;margin-bottom:3mm}
  #print .ph b{font-size:14pt;font-weight:600}
  #print .ph span{font:9pt var(--font-mono);color:#333}
  #print img{display:block;margin:0 auto}
  #print table{border-collapse:collapse;margin-top:5mm;font-size:9pt;width:100%;break-inside:auto}
  #print th,#print td{border-bottom:.2mm solid #999;padding:1mm 2mm;text-align:left}
  #print td.n{font-family:var(--font-mono);text-align:right}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="brand"><b>Grundriss-Planer</b><input id="plan-name" type="text" aria-label="Name des Grundrisses"></div>
    <div class="tools" role="toolbar" aria-label="Werkzeuge">
      <button class="tool" data-tool="select" aria-pressed="true" title="Auswählen und verschieben (V)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 3l13 8-6 1.5L9 19z"/></svg><span class="lbl">Auswählen</span><kbd>V</kbd></button>
      <button class="tool" data-tool="wall" aria-pressed="false" title="Wände zeichnen (W)">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h5v13h13v5H3z"/></svg><span class="lbl">Wand</span><kbd>W</kbd></button>
      <button class="tool" data-tool="object" aria-pressed="false" title="Objekt einfügen (O)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="14" height="12" rx="1"/><path d="M20 3v6M17 6h6"/></svg><span class="lbl">Objekt</span><kbd>O</kbd></button>
      <button class="tool" data-tool="path" aria-pressed="false" title="Weg zeichnen, z. B. Verkehrs- oder Fluchtweg (G)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 9h9v12M3 15h3v6"/><path d="M15 5l3 -2 3 2M18 3v9" stroke-linecap="round"/></svg><span class="lbl">Weg</span><kbd>G</kbd></button>
      <button class="tool" data-tool="text" aria-pressed="false" title="Text einfügen, z. B. Raumnamen (T)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5h14M12 5v15M9 20h6"/></svg><span class="lbl">Text</span><kbd>T</kbd></button>
      <button class="tool" data-tool="measure" aria-pressed="false" title="Distanz messen (M)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 16L16 3l5 5L8 21z"/><path d="M7 12l2 2M10 9l2 2M13 6l2 2"/></svg><span class="lbl">Messen</span><kbd>M</kbd></button>
    </div>
    <div class="seg" role="group" aria-label="Wandmaß">
      <span class="seg-l">Wandmaß</span><button data-lm="inner" title="Lichte Länge an der Raumseite (L wechselt)">Innen</button><button data-lm="outer" title="Länge an der Außenseite">Außen</button><button data-lm="axis" title="Länge auf der Wandmitte">Achse</button>
    </div>
    <div class="spacer"></div>
    <button class="act" id="b-undo" title="Rückgängig (Strg+Z)">Rückgängig</button>
    <button class="act" id="b-redo" title="Wiederholen (Strg+Y)">Wiederholen</button>
    <button class="act" id="b-save" title="Als Datei speichern (Strg+S)">Speichern</button>
    <button class="act" id="b-share" title="HTML-Datei mit diesem Plan zum Weitergeben speichern">Als HTML teilen</button>
    <button class="act" id="b-open" title="Gespeicherte Datei öffnen">Öffnen</button><input id="open-file" type="file" accept=".json,application/json" hidden>
    <button class="act" id="b-print" title="Drucken oder als PDF speichern (Strg+P)">Drucken / PDF</button>
    <button class="act" id="b-new">Neu</button>
  </div>
  <div class="main">
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="calib" id="calib" hidden><b>Maßstab noch nicht festgelegt.</b> Doppelklick auf eine Wand und die echte Länge eingeben. Die Zeichnung wird danach auf diesen Maßstab gebracht.</div>
      <div class="zoom">
        <button id="z-in" title="Vergrößern" aria-label="Vergrößern">+</button>
        <button id="z-out" title="Verkleinern" aria-label="Verkleinern">−</button>
        <button id="z-fit" title="Alles anzeigen (F)">FIT</button>
      </div>
      <div class="hint" id="hint"></div>
    </div>
    <aside>
      <div id="panel"></div>
      <div class="settings">
        <p class="eyebrow">Einstellungen</p>
        <div class="num"><span>Wandstärke</span><input id="s-thick" type="text" inputmode="decimal"></div>
        <label><input id="s-grid" type="checkbox" checked> Raster anzeigen</label>
        <label><input id="s-snap" type="checkbox" checked> Am Raster einrasten</label>
        <label><input id="s-gaps" type="checkbox" checked> Wandabstände am Objekt zeigen</label>
      </div>
    </aside>
  </div>
</div>

<div id="print"></div>
<div class="overlay" id="dlg" hidden>
  <form class="dlg" id="dlg-form" novalidate>
    <header><h3 id="dlg-title"></h3></header>
    <div class="body" id="dlg-body"></div>
    <footer><button type="button" class="act" id="dlg-cancel">Abbrechen</button><button type="submit" class="act primary" id="dlg-ok">Übernehmen</button></footer>
  </form>
</div>

<script id="plan-data" type="application/json"></script>
<script>
(()=>{
const SRC='<!doctype html>\n'+document.documentElement.outerHTML;
const $=s=>document.querySelector(s);
const cv=$('#cv'), stage=$('#stage');let ctx=cv.getContext('2d');
let EMB=null;try{const t=document.getElementById('plan-data').textContent.trim();if(t)EMB=JSON.parse(t)}catch(e){}
const KEY='grundriss-planer-v1'+(EMB&&EMB.stamp?':'+EMB.stamp:'');
const PAL=['#2f6fdb','#d4761c','#1e9a6e','#7a5bd1','#c83e52','#6b7a80'];
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let S, view={zoom:.6,ox:60,oy:60}, dpr=1;
let tool='select', sel=null, hover=null, drag=null;
let textBoxes=[];let draw={last:null,start:null,buf:''}, meas=null, cursorW=null, snapCur=null, guides=[], gapLabels=[];
let hist=[], redoStack=[];
const opts={grid:true,snap:true,gaps:true};
let C={};

/* ---------- Daten ---------- */
function sample(){
  const v=(id,x,y)=>({id,x,y});
  return {name:'Beispiel: Prüfhalle',calibrated:true,thick:24,
    verts:[v('a',0,0),v('e',800,0),v('b',1200,0),v('c',1200,800),v('d',0,800),v('f',800,450)],
    walls:[{id:'w1',a:'a',b:'e',fixed:true},{id:'w2',a:'e',b:'b'},{id:'w3',a:'b',b:'c',fixed:true},{id:'w4',a:'c',b:'d'},{id:'w5',a:'d',b:'a'},{id:'w6',a:'e',b:'f'}],
    objs:[
      {id:'o1',name:'Prüfling USV',x:310,y:200,w:360,d:100,rot:0,shape:'rect',color:PAL[0]},
      {id:'o2',name:'Lastbank',x:300,y:560,w:240,d:120,rot:0,shape:'rect',color:PAL[1]},
      {id:'o3',name:'Schaltschrank',x:1000,y:72,w:120,d:60,rot:0,shape:'rect',color:PAL[5]},
      {id:'o4',name:'Europalette',x:1040,y:620,w:120,d:80,rot:90,shape:'rect',color:PAL[2]},
      {id:'o5',name:'Werkbank',x:620,y:740,w:200,d:75,rot:0,shape:'rect',color:PAL[3]}],
    dims:[{id:'m1',x1:800,y1:462,x2:800,y2:788}],
    texts:[{id:'t1',x:400,y:320,text:'Prüffeld 1',size:40,bold:true,rot:0,color:''},{id:'t2',x:1000,y:330,text:'Lager',size:40,bold:true,rot:0,color:''}],
    paths:[{id:'p1',name:'Verkehrsweg',kind:'traffic',width:120,arrows:false,pts:[{x:100,y:430},{x:640,y:430},{x:640,y:620},{x:960,y:620}]}]};
}
function empty(){return {name:'Neuer Grundriss',calibrated:false,thick:24,verts:[],walls:[],objs:[],dims:[],texts:[],paths:[]}}
function valid(j){return j&&Array.isArray(j.verts)&&Array.isArray(j.walls)&&Array.isArray(j.objs)&&Array.isArray(j.dims)}
function load(){let j=null;try{j=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!valid(j)&&EMB&&valid(EMB.plan))j=JSON.parse(JSON.stringify(EMB.plan));
  if(valid(j)){S=j;S.texts=S.texts||[];S.paths=S.paths||[];return}S=sample()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const snap=()=>JSON.stringify(S);
function pushUndo(s){hist.push(s);if(hist.length>200)hist.shift();redoStack=[];undoBtns()}
function undo(){if(!hist.length)return;redoStack.push(snap());S=JSON.parse(hist.pop());after()}
function redo(){if(!redoStack.length)return;hist.push(snap());S=JSON.parse(redoStack.pop());after()}
function after(){S.texts=S.texts||[];S.paths=S.paths||[];pdraw={pts:[],buf:''};sel=null;draw={last:null,start:null,buf:''};meas=null;changed()}
function undoBtns(){$('#b-undo').disabled=!hist.length;$('#b-redo').disabled=!redoStack.length}
function changed(){save();syncUI();updatePanel();req()}

const V=id=>S.verts.find(v=>v.id===id);
const O=id=>S.objs.find(o=>o.id===id);
const Wl=id=>S.walls.find(w=>w.id===id);
const Dm=id=>S.dims.find(d=>d.id===id);
const Tx=id=>(S.texts||[]).find(t=>t.id===id);
const Pt=id=>(S.paths||[]).find(p=>p.id===id);
const PKINDS={traffic:{n:'Verkehrsweg',c:'#d9a400',w:120,ar:false},escape:{n:'Fluchtweg',c:'#1e9a6e',w:120,ar:true},forklift:{n:'Staplerweg',c:'#d4761c',w:250,ar:false},walk:{n:'Laufweg',c:'#2f6fdb',w:80,ar:true}};
let pdraw={pts:[],buf:''},pathDef={kind:'traffic',width:120};
function pathLen(pts){let l=0;for(let i=1;i<pts.length;i++)l+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);return l}
function dedupe(pts){return pts.filter((q,i)=>!i||Math.hypot(q.x-pts[i-1].x,q.y-pts[i-1].y)>.01)}
function offsetLine(pts,d){const n=pts.length,out=[];
  const nr=i=>{const a=pts[i],b=pts[i+1],l=Math.hypot(b.x-a.x,b.y-a.y)||1;return [-(b.y-a.y)/l,(b.x-a.x)/l]};
  for(let i=0;i<n;i++){let m;if(i===0)m=nr(0);else if(i===n-1)m=nr(n-2);
    else{const a=nr(i-1),b=nr(i);let mx=a[0]+b[0],my=a[1]+b[1];const ml=Math.hypot(mx,my);

function renderPlan(wCss,hCss,k,z,A,grid){const c=document.createElement('canvas');c.width=Math.round(wCss*k);c.height=Math.round(hCss*k);
  const keep={ctx,view,dpr,C,sel,hover,tool,snapCur,grid:opts.grid,gl:gapLabels,tb:textBoxes};
  ctx=c.getContext('2d');dpr=k;C=LIGHT;sel=null;hover=null;tool='print';snapCur=null;opts.grid=grid;
  view={zoom:z,ox:wCss/2-(A.minx+A.maxx)/2*z,oy:hCss/2-(A.miny+A.maxy)/2*z};
  try{render(wCss,hCss)}finally{ctx=keep.ctx;view=keep.view;dpr=keep.dpr;C=keep.C;sel=keep.sel;hover=keep.hover;tool=keep.tool;snapCur=keep.snapCur;opts.grid=keep.grid;gapLabels=keep.gl;textBoxes=keep.tb}
  return c}

function updatePanel(){const P=$('#panel');let h='';
  if(sel?.type==='obj'&&O(sel.id)){const o=O(sel.id),A=aabb(o);
    h=`<p class="eyebrow">Objekt</p><h2>${esc(o.name)}</h2><dl class="props"><dt>Breite</dt><dd>${num(o.w)} cm</dd><dt>Tiefe</dt><dd>${num(o.d)} cm</dd><dt>Drehung</dt><dd>${num(o.rot)}°</dd><dt>Fläche</dt><dd>${num(o.shape==='circle'?Math.PI*o.w*o.d/4/1e4:o.w*o.d/1e4,2)} m²</dd><dt>Belegt (X × Y)</dt><dd>${num(A.maxx-A.minx)} × ${num(A.maxy-A.miny)}</dd></dl>
    <div class="btns"><button class="act" data-act="edit">Größe ändern</button><button class="act" data-act="rot">Drehen 90°</button><button class="act" data-act="dup">Duplizieren</button><button class="act danger" data-act="del">Löschen</button></div>
    <p class="note">Grüne Abstände zeigen den Freiraum bis zur Wand oder zum nächsten Objekt. Ein Klick darauf setzt den Abstand exakt. Pfeiltasten verschieben um 1&nbsp;cm (Shift: 10&nbsp;cm).</p>`}
  else if(sel?.type==='wall'&&Wl(sel.id)){const w=Wl(sel.id),a=V(w.a),b=V(w.b);let ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;ang=((ang%180)+180)%180;
    h=`<p class="eyebrow">Wand · ${LM_NAME[lenMode()]}</p><h2>${fmt(measureWall(w).len)}</h2><dl class="props"><dt>Innen</dt><dd>${fmt(measureWall(w,'inner').len)}</dd><dt>Außen</dt><dd>${fmt(measureWall(w,'outer').len)}</dd><dt>Achse</dt><dd>${fmt(wallLen(w))}</dd><dt>Status</dt><dd>${w.fixed?'<span class="chip fix">festgelegt</span>':'<span class="chip free">gezeichnet</span>'}</dd><dt>Richtung</dt><dd>${num(ang)}°</dd><dt>Stärke</dt><dd>${num(S.thick)} cm</dd></dl>
    <div class="btns"><button class="act primary" data-act="len">Länge festlegen</button><button class="act danger" data-act="del">Löschen</button></div>
    <p class="note">${S.calibrated?'Eine neue Länge verschiebt den gewählten Endpunkt. Ziehen verschiebt die Wand parallel.':'Die erste festgelegte Länge setzt den Maßstab der ganzen Zeichnung.'}</p>`}
  else if(sel?.type==='path'&&Pt(sel.id)){const p=Pt(sel.id),L=pathLen(p.pts);
    h=`<p class="eyebrow">Weg · ${(PKINDS[p.kind]||PKINDS.traffic).n}</p><h2>${esc(p.name)}</h2><dl class="props"><dt>Länge</dt><dd>${fmt(L)}</dd><dt>Breite</dt><dd>${num(p.width)} cm</dd><dt>Fläche ca.</dt><dd>${num(L*p.width/1e4,2)} m²</dd><dt>Wegpunkte</dt><dd>${p.pts.length}</dd></dl>
    <div class="btns"><button class="act" data-act="pedit">Bearbeiten</button>${p.arrows?'<button class="act" data-act="prev">Richtung umkehren</button>':''}<button class="act danger" data-act="del">Löschen</button></div>
    <p class="note">Wegpunkte (Quadrate) lassen sich ziehen. Ziehen am Weg verschiebt ihn komplett, Pfeiltasten in 1-cm-Schritten.</p>`}
  else if(sel?.type==='text'&&Tx(sel.id)){const t=Tx(sel.id);
    h=`<p class="eyebrow">Text</p><h2>${esc(t.text).replace(/\n/g,'<br>')}</h2><dl class="props"><dt>Schrifthöhe</dt><dd>${num(t.size)} cm</dd><dt>Ausrichtung</dt><dd>${t.rot?'senkrecht':'waagerecht'}</dd></dl>
    <div class="btns"><button class="act" data-act="tedit">Bearbeiten</button><button class="act" data-act="rot">Drehen 90°</button><button class="act danger" data-act="del">Löschen</button></div>
    <p class="note">Doppelklick auf den Text bearbeitet ihn. Ziehen oder Pfeiltasten verschieben ihn.</p>`}
  else if(sel?.type==='dim'&&Dm(sel.id)){const m=Dm(sel.id);
    h=`<p class="eyebrow">Messung</p><h2>${fmt(Math.hypot(m.x2-m.x1,m.y2-m.y1))}</h2><dl class="props"><dt>Δ X</dt><dd>${fmt(Math.abs(m.x2-m.x1))}</dd><dt>Δ Y</dt><dd>${fmt(Math.abs(m.y2-m.y1))}</dd></dl>
    <div class="btns"><button class="act danger" data-act="del">Löschen</button></div><p class="note">Endpunkte lassen sich ziehen.</p>`}
  else{sel=null;let A=null;if(S.verts.length){A={minx:1e9,maxx:-1e9,miny:1e9,maxy:-1e9};S.verts.forEach(v=>{A.minx=Math.min(A.minx,v.x);A.maxx=Math.max(A.maxx,v.x);A.miny=Math.min(A.miny,v.y);A.maxy=Math.max(A.maxy,v.y)})}
    const tot=S.walls.reduce((s,w)=>s+wallLen(w),0);
    h=`<p class="eyebrow">Übersicht</p><h2>${esc(S.name||'Grundriss')}</h2><dl class="props">
      <dt>Außenmaß</dt><dd>${A?fmt(A.maxx-A.minx+S.thick)+' × '+fmt(A.maxy-A.miny+S.thick):'–'}</dd><dt>Wandmaß</dt><dd>${LM_NAME[lenMode()]}</dd><dt>Wände</dt><dd>${S.walls.length} · ${fmt(tot)}</dd><dt>Messungen</dt><dd>${S.dims.length}</dd><dt>Texte</dt><dd>${(S.texts||[]).length}</dd><dt>Maßstab</dt><dd>${S.calibrated?'<span class="chip fix">festgelegt</span>':'<span class="chip free">offen</span>'}</dd></dl>
      <p class="eyebrow" style="margin-top:18px">Objekte (${S.objs.length})</p>
      ${S.objs.length?`<div class="list">${S.objs.map(o=>`<button class="row" data-act="pick" data-id="${o.id}"><i class="sw" style="background:${o.color}"></i><span class="nm">${esc(o.name)}</span><span class="sz">${num(o.w)}×${num(o.d)}</span></button>`).join('')}</div>`:'<p class="note">Noch keine Objekte. Über „Objekt“ oder Taste O einfügen.</p>'}
      ${(S.paths||[]).length?`<p class="eyebrow" style="margin-top:18px">Wege (${S.paths.length})</p><div class="list">${S.paths.map(p=>`<button class="row" data-act="pickp" data-id="${p.id}"><i class="sw" style="background:${(PKINDS[p.kind]||PKINDS.traffic).c}"></i><span class="nm">${esc(p.name)}</span><span class="sz">${num(p.width)} · ${fmt(pathLen(p.pts))}</span></button>`).join('')}</div>`:''}
      <div class="btns"><button class="act" data-act="add">Objekt einfügen</button><button class="act" data-act="addpath">Weg zeichnen</button><button class="act" data-act="addtext">Text einfügen</button></div>`}
  P.innerHTML=h}
$('#panel').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='edit')openObjDialog(O(sel.id));if(a==='rot')rotateSel();if(a==='dup')duplicateSel();if(a==='del')deleteSel();
  if(a==='len')openWallDialog(Wl(sel.id));if(a==='tedit')openTextDialog(Tx(sel.id));if(a==='addtext')setTool('text');if(a==='addpath')setTool('path');if(a==='pedit')openPathDialog(Pt(sel.id));
  if(a==='prev'){pushUndo(snap());Pt(sel.id).pts.reverse();changed()}
  if(a==='pickp'){sel={type:'path',id:b.dataset.id};setTool('select');updatePanel();req()}if(a==='add')openObjDialog();
  if(a==='pick'){sel={type:'obj',id:b.dataset.id};setTool('select');updatePanel();req()}});

function syncUI(){document.querySelectorAll('[data-lm]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lm===lenMode())));$('#calib').hidden=S.calibrated||!S.walls.length;if(document.activeElement!==$('#plan-name'))$('#plan-name').value=S.name||'';
  if(document.activeElement!==$('#s-thick'))$('#s-thick').value=num(S.thick)+' cm';undoBtns()}
function setLenMode(m){S.lenMode=m;changed()}
document.querySelectorAll('[data-lm]').forEach(b=>b.addEventListener('click',()=>setLenMode(b.dataset.lm)));
$('#plan-name').addEventListener('input',e=>{S.name=e.target.value;save();if(!sel)updatePanel()});
$('#s-thick').addEventListener('change',e=>{const t=parseLen(e.target.value);if(t>0&&t<200){pushUndo(snap());S.thick=t}changed()});
$('#s-grid').addEventListener('change',e=>{opts.grid=e.target.checked;req()});
$('#s-snap').addEventListener('change',e=>{opts.snap=e.target.checked});
$('#s-gaps').addEventListener('change',e=>{opts.gaps=e.target.checked;req()});

/* ---------- Start ---------- */
function resize(){dpr=window.devicePixelRatio||1;cv.width=Math.round(cv.clientWidth*dpr);cv.height=Math.round(cv.clientHeight*dpr);req()}
new ResizeObserver(resize).observe(stage);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors);
new MutationObserver(readColors).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
load();readColors();resize();syncUI();updatePanel();setTool('select');requestAnimationFrame(fit);
document.fonts?.ready.then(req);
})();
</script>
</body>
</html>
